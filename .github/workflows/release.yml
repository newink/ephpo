name: Release to Maven Central

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: maven-central-release
  cancel-in-progress: false

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag, branch, and version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must have the form vX.Y.Z" >&2
            exit 1
          fi
          pom_version="$(
            ./mvnw --quiet --no-transfer-progress \
              -Dstyle.color=never \
              -Dexpression=project.version \
              -DforceStdout \
              help:evaluate
          )"
          if [[ "$version" != "$pom_version" ]]; then
            echo "Tag version $version does not match POM $pom_version" >&2
            exit 1
          fi

  quality:
    name: Release quality gate
    needs: preflight
    secrets: inherit
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to Maven Central
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: maven-central
    steps:
      - name: Check out release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Java and Maven Central credentials
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: pom.xml
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
      - name: Sign and publish release
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: >-
          ./mvnw --batch-mode --no-transfer-progress
          -DskipTests
          -Dgpg.signer=bc
          -Psonatype
          clean deploy
