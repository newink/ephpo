version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "Bump"
    ignore:
      # JUnit 6 requires Java 17, while this library keeps a Java 11 baseline.
      # Lift this once the baseline moves.
      - dependency-name: "org.junit*"
        update-types:
          - "version-update:semver-major"
    groups:
      junit:
        patterns:
          - "org.junit*"
      maven-plugins:
        patterns:
          - "org.apache.maven.plugins:*"
          - "org.jacoco:*"
          - "com.qulice:*"
          - "org.sonatype.central:*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "Bump"
    groups:
      actions:
        patterns:
          - "*"
