name: Question
description: Ask how to use ephpo, or whether it fits your setup
labels:
  - question
body:
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: >
        What are you trying to do, and what have you tried? Include the
        relevant part of your test and your build configuration.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ephpo version
      placeholder: "1.0.0"
    validations:
      required: false
